kind = "web"
previewPath = "/"
title = "Works. — Insight-tól prototípusig"
version = "1.0.0"
id = "artifacts/works-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24997

[services.development]
run = "pnpm --filter @workspace/works-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/works-landing", "run", "build" ]
publicDir = "artifacts/works-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24997"
BASE_PATH = "/"
